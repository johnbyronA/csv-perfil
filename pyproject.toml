[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-perfil"
version = "0.1.0"
description = "Perfilado rápido de archivos CSV desde la terminal: tipos, nulos, únicos y estadísticas."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "John Byron Alzate Hernández" }]
keywords = ["csv", "data-profiling", "cli", "analytics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
csv-perfil = "csv_perfil.cli:main"

[project.urls]
Homepage = "https://github.com/johnbyronA/csv-perfil"
Issues = "https://github.com/johnbyronA/csv-perfil/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
